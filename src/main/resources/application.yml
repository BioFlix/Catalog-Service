server:
  port: 8082

spring:
  application:
    name: catalog-service

  mongodb:
    uri: mongodb://${MONGO_HOST:localhost}:27018/catalog_db

  data:
    mongodb:
      auto-index-creation: true

  grpc:
    server:
      port: 9090      # Booking connects here

app:
  seed-data: true     # inserts a few demo movies/halls/showtimes if the DB is empty

management:
  endpoints:
    web:
      exposure:
        include: health,info