// gRPC contract between catalog-service (server) and booking-service (client).
// The SAME file must exist in both repos – if you change it, change it in both.
syntax = "proto3";

package bioflix.catalog;

option java_package = "bioflix.grpc.catalog";
option java_multiple_files = true;
option java_outer_classname = "CatalogProto";

service CatalogService {
  // Booking asks for showtime details before it reserves seats.
  rpc GetShowtime (GetShowtimeRequest) returns (ShowtimeDetails);
}

message GetShowtimeRequest {
  string showtime_id = 1;
}

message ShowtimeDetails {
  string showtime_id = 1;
  string movie_id = 2;
  string movie_title = 3;
  string hall_id = 4;
  string hall_name = 5;
  int64 start_time_epoch_seconds = 6;
  int64 price_minor = 7;      // price per seat in øre (minor units), e.g. 12500 = 125,00 kr
  string currency = 8;        // e.g. "DKK"
  int32 rows = 9;             // hall layout: rows A, B, C ...
  int32 seats_per_row = 10;   // seats 1..seats_per_row
}
