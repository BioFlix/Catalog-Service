syntax = "proto3";

package bioflix.catalog.grpc;

option java_multiple_files = true;
option java_package = "bioflix.catalog.grpc";

// Called by the Booking service when a booking is created and when the seat map is shown.
service CatalogService {
  rpc GetShowtime (GetShowtimeRequest) returns (ShowtimeResponse);
}

message GetShowtimeRequest {
  string showtime_id = 1;
}

message ShowtimeResponse {
  string showtime_id = 1;
  string movie_id = 2;
  string movie_title = 3;
  string hall_id = 4;
  string hall_name = 5;
  string cinema_name = 6;
  string starts_at = 7;          // ISO-8601 UTC
  string ends_at = 8;            // ISO-8601 UTC
  string format = 9;
  string status = 10;            // SCHEDULED | CANCELLED
  string currency = 11;
  map<string, int32> prices = 12; // seat type -> price in oere
  repeated SeatRow rows = 13;
}

message SeatRow {
  string label = 1;
  repeated Seat seats = 2;
}

message Seat {
  int32 number = 1;
  string type = 2;               // STANDARD | VIP | WHEELCHAIR
}
