name: Catalog CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: catalog-service

jobs:
  # 1. Unit tests + MongoDB integration tests (Testcontainers needs Docker, which the runner has)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test

  # 2. Build the image and push it to Azure Container Registry (only on main)
  build-push-image:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.ACR_NAME }}.azurecr.io/catalog-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.SERVICE_PRINCIPAL_ID }}
          password: ${{ secrets.SERVICE_PRINCIPAL_PASSWORD }}
      - run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
      - run: docker push --all-tags $IMAGE

  # 3. Deploy to AKS (optional cloud step; waits for a reviewer on the PROD environment)
  deploy-to-aks:
    needs: build-push-image
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: azure/aks-set-context@v4
        with:
          cluster-name: ${{ secrets.AKS_NAME }}
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
      - uses: azure/k8s-deploy@v5
        with:
          manifests: |
            kubernetes/mongo/deployment.yaml
            kubernetes/mongo/service.yaml
            kubernetes/catalog-service/deployment.yaml
            kubernetes/catalog-service/service.yaml
          images: |
            ${{ secrets.ACR_NAME }}.azurecr.io/catalog-service:${{ github.sha }}
